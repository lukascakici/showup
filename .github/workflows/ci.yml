name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STELLAR_CLI_VERSION: 27.0.0
  # Pinned so a re-tagged release can't quietly change the compiler that
  # produces the wasm we deploy.
  STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556
  # CoinFabrik Scout. Pinned for the same reason the CLI is: a security report
  # has to name the version that produced it, and a detector set that changes
  # underneath the report makes every finding in it unreproducible.
  SCOUT_VERSION: 0.3.17

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml, including its targets and components.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install the Stellar CLI
        run: |
          set -euo pipefail
          file="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$file" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${file}"
          echo "${STELLAR_CLI_SHA256}  ${file}" | sha256sum --check
          # The tarball holds a bare `stellar` binary at its root.
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$file" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all --check

      # Must come before clippy and the tests: contracts/factory/src/test.rs
      # pulls the event contract in with contractimport!, which needs the wasm at
      # compile time. Without it, `cargo clippy --all-targets` and `cargo test`
      # both fail to build.
      - name: Build the contracts
        run: stellar contract build --locked

      - name: Check the committed bindings against the contract source
        run: node scripts/check-bindings.mjs

      # The README publishes the event wasm hash as Deliverable 1 and 2 evidence.
      # Nothing was checking it, and it sat at v1's hash through two contract
      # revisions and a redeploy. Now a stale claim is a red build.
      #
      # This one reads Testnet — a keyless, free `stellar contract read`. It
      # can't compare against the local build instead: the wasm is not
      # byte-reproducible across host platforms. An unreachable RPC skips with a
      # warning; a genuine mismatch always fails.
      - name: Check the published event wasm hash against the deployed factory
        run: node scripts/check-wasm-hash.mjs

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # The security pass promised by SOW 3 Deliverable 2, run against the contract
  # layer frozen on 17.11.2026.
  #
  # `continue-on-error` on purpose, for now. A scanner that fails the build on
  # its first run is a scanner somebody disables on its first run; the baseline
  # is 11 critical and 24 medium findings, and triaging them is the deliverable
  # rather than a red tick.
  #
  # It is also **slow** — ten to twenty minutes cold, because Scout builds dylint
  # drivers against rustc internals before it analyses anything. Two things keep
  # that off the critical path: it runs in parallel with `contracts` and `web`
  # and blocks neither, and it only runs when the contracts actually change.
  # Analysing a frozen contract layer again because a markdown file moved is
  # twenty minutes of nothing.
  security:
    name: Security
    runs-on: ubuntu-latest
    # Blocking, as of 21.11.2026. It was `continue-on-error: true` while the
    # baseline was untriaged, because a job that is red on 73 known findings is
    # a job everybody learns to ignore. Now that each of those findings has a
    # written decision in docs/SOW3/security.md, anything Scout reports beyond
    # them is genuinely new — see the gate step at the end of this job.
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the comparison below spans everything a push
          # contained, which can be any number of commits back.
          fetch-depth: 0

      # "On every change" in the SOW means every change to the contracts. A
      # pull request always runs; a push only runs if it touched the contract
      # layer or this workflow.
      #
      # The range is the **whole push**, not `HEAD~1..HEAD`. A push of two
      # commits where only the earlier one touches the contracts is exactly the
      # case the narrower form gets wrong, and it got it wrong here: the commit
      # fixing this job shipped alongside a web-only commit and the analysis was
      # skipped, so the fix went to main unverified.
      - name: Decide whether there is anything to analyse
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          paths="contracts Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/ci.yml"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # A new branch, a force push, or a rewritten history — nothing
            # trustworthy to compare against, so analyse rather than assume.
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${BEFORE}" "${{ github.sha }}" -- $paths; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in the contract layer changed in this push — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the pinned Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: rustup show

      # Deliberately **no** `Swatinem/rust-cache` here, unlike the contracts job.
      # It prunes `~/.cargo/git` down to `db` and drops `checkouts`, and Scout
      # builds its detector library out of exactly that checkout
      # (`~/.cargo/git/checkouts/scout-audit-*/nightly/*/detectors/soroban`).
      # With a warm rust-cache this job fails at "Compiling detectors" — it
      # passed on the run before the cache existed and failed on the one after,
      # which is how this was found.
      #
      # What is worth caching is Scout's own build, and only that: artefacts
      # that depend on the pinned version and nothing in this repository.
      #
      # `~/.cargo/git` is in here for the same reason rust-cache had to come
      # out, one layer down. The first version of this cache saved only the
      # binary and the drivers, which made `cargo install` a no-op on a hit —
      # and that install is the only thing that creates the git checkout Scout
      # builds its detector library from. The result was a job that passed cold
      # and failed warm with "Failed to build detector library", which is the
      # same symptom as the rust-cache problem from the opposite cause: that
      # action pruned the checkout, this cache never saved it.
      #
      # The step below no longer trusts that, cache or no cache.
      - name: Cache Scout
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-scout-audit
            ~/.dylint_drivers
            ~/.cargo/git
          key: scout-v2-${{ runner.os }}-${{ env.SCOUT_VERSION }}

      # Scout analyses the whole workspace, and contracts/factory/src/test.rs
      # pulls the event contract in with contractimport!, which needs the wasm
      # to exist. Same ordering constraint the contracts job has.
      - name: Install the Stellar CLI
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          file="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$file" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${file}"
          echo "${STELLAR_CLI_SHA256}  ${file}" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$file" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the contracts
        if: steps.scope.outputs.run == 'true'
        run: stellar contract build --locked

      # Scout 0.3.17 pins dylint_driver 4.1.2, whose build script clones
      # rust-clippy and checks out the literal ref `master`. rust-clippy renamed
      # its default branch to `main`, so that build fails with
      # "revparse_ext failed for master" and Scout never runs at all.
      #
      # Fixed upstream in dylint 6.3.0; Scout has not adopted it
      # (CoinFabrik/scout-audit#350). Until it does, this points the clone at a
      # local mirror that has both names. The clone must be **full** — a shallow
      # one gets past the branch error and then fails to find the clippy commit
      # matching Scout's nightly.
      - name: Work around the rust-clippy branch rename
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          git clone --bare --quiet https://github.com/rust-lang/rust-clippy "$RUNNER_TEMP/rust-clippy.git"
          git -C "$RUNNER_TEMP/rust-clippy.git" branch master main
          git -C "$RUNNER_TEMP/rust-clippy.git" symbolic-ref HEAD refs/heads/master
          git config --global url."file://$RUNNER_TEMP/rust-clippy.git".insteadOf \
            https://github.com/rust-lang/rust-clippy

      # A cache hit is only usable if it brought the detector sources with it.
      # Scout needs both halves — the binary *and*
      # ~/.cargo/git/checkouts/scout-audit-*/*/nightly/*/detectors/soroban,
      # which it compiles on every run — so this checks for both and reinstalls
      # if either is missing, rather than inferring one from the other.
      - name: Install Scout
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          detectors=$(find "$HOME/.cargo/git/checkouts" -maxdepth 4 -type d \
            -path '*scout-audit*/nightly/*' -print -quit 2>/dev/null || true)

          if [ -x "$HOME/.cargo/bin/cargo-scout-audit" ] && [ -n "$detectors" ]; then
            echo "restored from cache: $(cargo scout-audit --version)"
            echo "detector sources:    $detectors"
          else
            [ -x "$HOME/.cargo/bin/cargo-scout-audit" ] \
              && echo "binary cached but detector sources are missing — reinstalling" \
              || echo "cold install"
            cargo install cargo-scout-audit --locked --version "${SCOUT_VERSION}" --force
          fi

      # Once, not once per output format. Each invocation re-runs the whole
      # analysis, and running it twice for a second file doubled a job that is
      # already the longest in this workflow. The published report that a
      # reviewer reads is docs/SOW3/security.md, written against this output;
      # the JSON is the raw evidence it can be checked against.
      - name: Scout
        if: steps.scope.outputs.run == 'true'
        run: cargo scout-audit --output-format raw-json --output-path scout-report.json

      # Uploaded before the gate below, and deliberately so: the run that fails
      # is the run whose raw evidence somebody needs to read.
      - name: Publish the findings
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: scout-report.json

      # What makes this job worth blocking on. Not "zero findings" — this
      # codebase has 61 it has decided to live with, each with a reason written
      # down — but "nothing Scout found that the report has no answer for".
      - name: Check the findings against the triaged baseline
        if: steps.scope.outputs.run == 'true'
        run: node scripts/check-scout-baseline.mjs scout-report.json

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in step with web/package.json's engines field, which is also what
          # Vercel reads — an open range there silently follows each new major.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Also runs each binding package's prepare script, which compiles the
      # dist/ that event-client and factory-client resolve through.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      # Three measurable mobile faults, checked every push rather than the once
      # somebody remembers to look at a phone. It needs no browser and no install,
      # which is the whole reason it can run here at all — see the script for what
      # it deliberately cannot see.
      - name: Mobile audit
        run: node ../scripts/mobile-audit.mjs

      - name: Build
        run: npm run build
