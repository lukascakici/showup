name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STELLAR_CLI_VERSION: 27.0.0
  # Pinned so a re-tagged release can't quietly change the compiler that
  # produces the wasm we deploy.
  STELLAR_CLI_SHA256: 357bf712f6353c28cd33c794402a3c87231757a5b305e6ef1604365af4fdd556

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml, including its targets and components.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install the Stellar CLI
        run: |
          set -euo pipefail
          file="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$file" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${file}"
          echo "${STELLAR_CLI_SHA256}  ${file}" | sha256sum --check
          # The tarball holds a bare `stellar` binary at its root.
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$file" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all --check

      # Must come before clippy and the tests: contracts/factory/src/test.rs
      # pulls the event contract in with contractimport!, which needs the wasm at
      # compile time. Without it, `cargo clippy --all-targets` and `cargo test`
      # both fail to build.
      - name: Build the contracts
        run: stellar contract build

      - name: Check the committed bindings against the contract source
        run: node scripts/check-bindings.mjs

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in step with web/package.json's engines field, which is also what
          # Vercel reads — an open range there silently follows each new major.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Also runs each binding package's prepare script, which compiles the
      # dist/ that event-client and factory-client resolve through.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
